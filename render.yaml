# One-click deploy on Render: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: shopsecure
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m ml.engine
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: TZ_OFFSET_HOURS
        value: "5.5"
      - key: DEMO_PASSWORD
        value: demo123
